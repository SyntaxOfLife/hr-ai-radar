<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR x AI 资讯台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e3a8a'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>HR</text></svg>">
  <style>
    :root { --text:#111827; --muted:#4b5563; --light:#6b7280; --border:#e5e7eb; --bg:#fafaf9; --accent:#1e3a8a; --accent-light:#eff6ff; }
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; -webkit-font-smoothing:antialiased }

    .head-bar { height:3px; background:var(--accent) }
    .header { max-width:1160px; margin:0 auto; padding:32px 24px 18px; border-bottom:1px solid var(--border) }
    .header h1 { font-family:'Noto Serif SC',serif; font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.5px }
    .header .sub { font-size:13px; color:var(--muted); margin-top:4px; font-family:'Noto Serif SC',serif }
    .header .time { font-size:12px; color:var(--light); margin-top:6px }

    .container { max-width:1160px; margin:0 auto; padding:20px 24px 48px; display:grid; grid-template-columns:1fr 280px; gap:36px; align-items:start }

    .main { min-width:0 }

    .mode-bar { display:flex;gap:14px;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:10px }
    .mode-btn { font-size:13px;padding:4px 0;border:none;background:none;color:var(--light);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;font-family:inherit;transition:all .15s }
    .mode-btn.on { color:var(--accent);border-bottom-color:var(--accent);font-weight:600 }

    .search { margin-bottom:14px }
    .search input { width:100%; padding:8px 14px; font-size:13px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font-family:inherit; outline:none; transition:border-color .15s }
    .search input:focus { border-color:var(--accent) }
    .search input::placeholder { color:var(--light) }

    .card { padding:16px 0;border-bottom:1px solid var(--border);transition:background .15s,opacity .15s }
    .card:last-child { border-bottom:none }
    .card:hover { background:rgba(0,0,0,.012); margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px }
    .card.featured { border-left:3px solid var(--accent); padding-left:14px; margin-left:-3px }
    .card.read { opacity:.45 }
    .mark-read { font-size:11px;color:var(--light);cursor:pointer;border:none;background:none;padding:2px 6px;font-family:inherit;border-radius:3px;transition:all .15s }
    .mark-read:hover { color:var(--accent);background:var(--accent-light) }

    .card-row1 { display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;flex-wrap:wrap }
    .card-cat { font-weight:600;letter-spacing:.3px;white-space:nowrap;color:var(--accent) }
    .card-top { font-size:10px;font-weight:700;color:#fff;background:var(--accent);padding:1px 6px;border-radius:3px;letter-spacing:1px }
    .card-src { font-weight:600;color:var(--muted) }
    .card-date { color:var(--light) }
    .card-score { font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px }
    .card-score.hi { background:var(--accent-light);color:var(--accent) }
    .card-score.mid { background:#f3f4f6;color:var(--muted) }
    .card-score.lo { color:var(--light) }

    .card-title { font-family:'Noto Serif SC',serif; font-size:18px;font-weight:600;line-height:1.4;margin-bottom:6px }
    .card-title a { color:var(--text);text-decoration:none }
    .card-title a:hover { color:var(--accent);text-decoration:underline }
    .card-title a::after { content:' \2197';font-size:11px;color:var(--light);font-family:'Inter',sans-serif;font-weight:400 }
    .card-eng { font-size:12px;color:var(--light);margin-bottom:4px }
    .card-desc { font-size:14px;color:var(--muted);line-height:1.7 }

    .side { position:sticky; top:20px; }
    .side-box { margin-bottom:24px }
    .side-title { font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--light);text-transform:uppercase;margin-bottom:10px;font-family:'Inter',sans-serif }

    .cat-nav { display:flex;flex-direction:column }
    .cat-nav .cn { display:flex;justify-content:space-between;align-items:center;padding:8px 0;border:none;background:none;cursor:pointer;font-size:13px;color:var(--muted);font-family:inherit;border-bottom:1px solid var(--border);transition:color .15s;text-align:left }
    .cat-nav .cn:hover { color:var(--text) }
    .cat-nav .cn.on { color:var(--accent);font-weight:600 }
    .cat-nav .cn:last-child { border-bottom:none }
    .cat-nav .cn .n { font-size:11px;color:var(--light);font-weight:400 }
    .cat-nav .cn.on .n { color:var(--accent) }

    .src-list { display:flex;flex-direction:column }
    .src-list .sr { display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;color:var(--muted) }
    .src-list .sr .n { color:var(--light);font-size:11px }

    .side-stats { display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden }
    .side-stats .ss { flex:1;text-align:center;padding:12px 6px;background:#fff }
    .side-stats .ss+.ss { border-left:1px solid var(--border) }
    .side-stats .n { font-size:24px;font-weight:700;color:var(--accent) }
    .side-stats .l { font-size:10px;color:var(--light);margin-top:2px }

    .skeleton .sk-line { height:12px;background:#e5e7eb;border-radius:3px;margin-bottom:8px;animation:shimmer 1.5s infinite }
    .sk-line.w60 { width:60% } .sk-line.w80 { width:80% } .sk-line.w100 { width:100% }
    @keyframes shimmer { 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }

    .empty { text-align:center;padding:80px 20px;color:var(--muted) }
    .empty .icon { font-size:36px;margin-bottom:10px }
    .empty .msg { font-family:'Noto Serif SC',serif;font-size:16px;margin-bottom:4px }
    .empty .hint { font-size:13px;color:var(--light) }
    .retry { display:inline-block;margin-top:12px;padding:6px 20px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit }

    .disclaimer { padding:12px 0;margin-bottom:14px;border-bottom:1px solid var(--border);font-family:'Noto Serif SC',serif;font-size:12px;color:var(--muted);font-style:italic }
    .footer { text-align:center;padding:20px;font-size:11px;color:var(--light);border-top:1px solid var(--border);max-width:1160px;margin:0 auto }

    @media(max-width:860px){
      .container { grid-template-columns:1fr; padding:12px 16px 32px }
      .side { position:static; order:-1; margin-bottom:8px }
      .cat-nav { flex-direction:row;flex-wrap:wrap;gap:6px }
      .cat-nav .cn { border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px }
      .cat-nav .cn.on { background:var(--accent);color:#fff;border-color:var(--accent) }
      .cat-nav .cn .n { display:none }
      .cat-nav .cn.on .n { display:none }
      .src-list { display:none }
      .side-stats { display:none }
      .header { padding:24px 16px 16px }
      .header h1 { font-size:22px }
      .card-title { font-size:16px }
    }
  </style>
</head>
<body>
<div class="head-bar"></div>
<div class="header">
  <h1>HR x AI 资讯台</h1>
  <div class="sub">聚焦人力资源与人工智能交叉领域</div>
  <div class="time" id="time"></div>
</div>

<div class="container">
  <div class="main">
    <div class="mode-bar" id="modes" style="display:none">
      <button class="mode-btn on" id="btnAll">全部</button>
      <button class="mode-btn" id="btnSig">高相关度</button>
    </div>
    <div class="search" id="searchBox" style="display:none">
      <input type="search" id="searchInput" placeholder="搜索标题、摘要、来源…">
    </div>
    <div class="list" id="list">
      <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
      <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
      <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
    </div>
  </div>

  <aside class="side" id="side" style="display:none">
    <div class="side-box">
      <div class="side-title">分类</div>
      <div class="cat-nav" id="catNav"></div>
    </div>
    <div class="side-box">
      <div class="side-title">概览</div>
      <div class="side-stats">
        <div class="ss"><div class="n" id="st1">-</div><div class="l">资讯</div></div>
        <div class="ss"><div class="n" id="st2">-</div><div class="l">来源</div></div>
        <div class="ss"><div class="n" id="st3">-</div><div class="l">高相关</div></div>
      </div>
    </div>
    <div class="side-box">
      <div class="side-title">来源分布</div>
      <div class="src-list" id="srcList"></div>
    </div>
  </aside>
</div>

<div class="footer">
  <div>HR x AI 资讯台 · 内部试运行</div>
  <div style="margin-top:6px">本页面仅汇总公开资讯，不构成劳动法律意见。政策类内容请以官方原文及法务意见为准。</div>
</div>

<script>
var mode='all', cat='', q='', store;
var readSet={};
try{readSet=JSON.parse(localStorage.getItem('hr_read')||'{}')}catch(e){readSet={}}

fetch('../data/hr-radar.json').then(function(r){return r.json()}).then(function(d){
  var t=(d.generated_at||'').substring(0,19).replace('T',' ');
  document.getElementById('time').textContent=t;
  var all=d.all_items||[],cats=d.categories||[];
  if(!all.length){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">\u{1F4ED}</div><div class="msg">暂无资讯</div><div class="hint">上次更新：'+(t||'未知')+'</div></div>';return}
  store=d;
  document.getElementById('modes').style.display='flex';
  document.getElementById('searchBox').style.display='block';
  document.getElementById('side').style.display='block';
  buildNav(cats);
  buildStats(all);
  buildSrc(all);
  render();
}).catch(function(e){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">⚠️</div><div class="msg">数据加载失败</div><div class="hint">'+esc(e.message)+'</div><button class="retry" onclick="location.reload()">重新加载</button></div>'});

function buildNav(cats){
  var h='<button class="cn on" data-cat="">全部<span class="n">'+store.all_items.length+'</span></button>';
  for(var i=0;i<cats.length;i++){
    var n=((store.items_by_category||{})[cats[i]]||[]).length;
    if(!n)continue;
    h+='<button class="cn" data-cat="'+esc(cats[i])+'">'+esc(cats[i])+'<span class="n">'+n+'</span></button>';
  }
  document.getElementById('catNav').innerHTML=h;
  document.getElementById('catNav').onclick=function(e){
    var t=e.target.closest('.cn');if(!t)return;
    cat=t.dataset.cat||'';
    document.querySelectorAll('.cn').forEach(function(x){x.classList.toggle('on',x===t)});
    render();
  };
}

function buildStats(all){
  document.getElementById('st1').textContent=all.length;
  var srcs=new Set();all.forEach(function(x){srcs.add(x.source_name)});
  document.getElementById('st2').textContent=srcs.size;
  document.getElementById('st3').textContent=all.filter(function(x){return(x.relevance||0)>=0.58}).length;
}

function buildSrc(all){
  var m={};
  all.forEach(function(x){m[x.source_name]=(m[x.source_name]||0)+1});
  var arr=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
  var h='';
  arr.forEach(function(k){h+='<div class="sr"><span>'+esc(k)+'</span><span class="n">'+m[k]+'</span></div>'});
  document.getElementById('srcList').innerHTML=h;
}

function scoreLabel(s){if(s>=0.58)return'hi';if(s>=0.3)return'mid';return'lo'}
function scoreText(s){if(s>=0.58)return'高相关';if(s>=0.3)return'中相关';return''}

function render(){
  var el=document.getElementById('list'),h='',all=store.all_items||[],byCat=store.items_by_category||{};
  var items=cat?(byCat[cat]||[]):all.slice();
  if(mode==='signal')items=items.filter(function(x){return(x.relevance||0)>=0.58});
  if(q){var ql=q.toLowerCase();items=items.filter(function(x){var hay=(x.title+' '+(x.title_zh||'')+' '+(x.summary_zh||'')+' '+(x.source_name||'')).toLowerCase();return hay.indexOf(ql)>=0})}
  if(!items.length){el.innerHTML='<div class="empty"><div class="msg">无匹配内容</div></div>';return}
  for(var i=0;i<items.length;i++){
    var it=items[i],t=it.title_zh||it.title,sc=it.relevance||0,sl=scoreLabel(sc),st=scoreText(sc);
    if(it.source_id==='aihot'&&t.indexOf('AI HOT')===0){var m=t.match(/— (.+)/);t=m?m[1]:t}
    var fea=(mode==='all'&&!cat&&i<2)?' featured':'';
    var isRead=readSet[it.id];
    h+='<div class="card'+fea+(isRead?' read':'')+'" data-id="'+esc(it.id)+'">';
    h+='<div class="card-row1">';
    if(fea)h+='<span class="card-top">要闻</span>';
    h+='<span class="card-cat">'+esc(it.category||'')+'</span>';
    h+='<span class="card-src">'+esc(it.source_name||'')+'</span>';
    if(st)h+='<span class="card-score '+sl+'" title="相关度 '+sc.toFixed(2)+'">'+st+'</span>';
    h+='<span class="card-date">'+fmt(it.published_at)+'</span>';
    h+='<button class="mark-read" data-act="read" title="'+(isRead?'取消已读':'标记为已读')+'">'+(isRead?'✓ 已读':'○')+'</button>';
    h+='</div>';
    h+='<div class="card-title"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(t)+'</a></div>';
    if(it.title_zh&&it.title_zh!==it.title)h+='<div class="card-eng">'+esc(it.title)+'</div>';
    if(it.summary_zh)h+='<div class="card-desc">'+esc(it.summary_zh)+'</div>';
    h+='</div>';
  }
  el.innerHTML=h;
}

document.getElementById('btnSig').onclick=function(){mode='signal';u()};
document.getElementById('btnAll').onclick=function(){mode='all';u()};
document.getElementById('searchInput').oninput=function(){q=this.value.trim();render()};
function u(){document.getElementById('btnSig').className='mode-btn'+(mode==='signal'?' on':'');document.getElementById('btnAll').className='mode-btn'+(mode==='all'?' on':'');render()}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmt(s){if(!s)return'';try{var d=new Date(s),now=new Date(),diff=(now-d)/1000;if(diff<3600)return Math.max(1,Math.floor(diff/60))+'分钟前';if(diff<86400)return Math.floor(diff/3600)+'小时前';if(diff<172800)return'昨天';if(diff<604800)return Math.floor(diff/86400)+'天前';return d.toLocaleString('zh-CN',{month:'short',day:'numeric'})}catch(e){return''}}

document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-act="read"]');if(!b)return;
  var card=b.closest('.card');if(!card)return;
  var id=card.dataset.id;
  readSet[id]=!readSet[id];
  try{localStorage.setItem('hr_read',JSON.stringify(readSet))}catch(err){}
  card.classList.toggle('read',readSet[id]);
  b.textContent=readSet[id]?'✓ 已读':'○';
  b.title=readSet[id]?'取消已读':'标记为已读';
});
</script>
</body>
</html>
