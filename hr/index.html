<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR × AI 资讯台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e3a8a'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>HR</text></svg>">
  <style>
    :root { --text:#111827; --muted:#4b5563; --light:#9ca3af; --border:#e5e7eb; --bg:#fafaf9; --accent:#1e3a8a; }
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased }

    .head-bar { height:3px; background:linear-gradient(90deg,#1e3a8a,#3b82f6,#0891b2,#6d28d9) }
    .header { max-width:960px; margin:0 auto; padding:32px 20px 18px; border-bottom:1px solid var(--border) }
    .header h1 { font-family:'Noto Serif SC',serif; font-size:28px; font-weight:700; color:var(--accent); letter-spacing:-0.5px }
    .header .sub { font-size:13px; color:var(--muted); margin-top:4px; font-family:'Noto Serif SC',serif }
    .header .time { font-size:12px; color:var(--light); margin-top:6px }

    .container { max-width:960px; margin:0 auto; padding:16px 20px 48px }

    .stats { display:flex; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:14px }
    .stats .s { flex:1; text-align:center }
    .stats .s+.s { border-left:1px solid var(--border) }
    .stats .n { font-size:30px; font-weight:700; color:var(--accent) }
    .stats .l { font-size:11px; color:var(--light); margin-top:2px }

    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px }
    .tab { font-size:13px; padding:5px 12px; border-radius:16px; cursor:pointer; white-space:nowrap; background:none; border:1px solid var(--border); color:var(--muted); transition:all .15s }
    .tab:hover { color:var(--text);border-color:var(--light) }
    .tab.on { background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600 }
    .tab .c { font-size:10px;opacity:.6;margin-left:2px;font-weight:400 }

    .mode-bar { display:flex;gap:12px;margin-bottom:14px }
    .mode-btn { font-size:13px;padding:4px 0;border:none;background:none;color:var(--light);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;transition:all .15s }
    .mode-btn.on { color:var(--accent);border-bottom-color:var(--accent);font-weight:600 }
    .mode-hint { font-size:11px;color:var(--light);margin-left:4px;cursor:help }

    .card { padding:18px 0;border-bottom:1px solid var(--border) }
    .card:last-child { border-bottom:none }

    .card-row1 { display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px }
    .card-cat { font-weight:600;letter-spacing:.3px;white-space:nowrap }
    .card-cat.policy { color:#991b1b } .card-cat.recruit { color:#1e40af } .card-cat.org { color:#6d28d9 } .card-cat.learn { color:#047857 } .card-cat.product { color:#b45309 } .card-cat.case { color:#0e7490 }
    .card-src { font-weight:600;color:var(--accent) }
    .card-date { color:var(--light);margin-left:auto }
    .card-score { font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px }
    .card-score.hi { background:#ecfdf5;color:#059669 }
    .card-score.mid { background:#fef3c7;color:#92400e }
    .card-score.lo { color:var(--light) }

    .card-title { font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;line-height:1.4;margin-bottom:6px }
    .card-title a { color:var(--text);text-decoration:none }
    .card-title a:hover { color:var(--accent);text-decoration:underline }
    .card-title a::after { content:' ↗';font-size:11px;color:var(--light);font-family:'Inter',sans-serif }
    .card-eng { font-size:11px;color:var(--light);margin-bottom:4px }
    .card-desc { font-size:14px;color:var(--muted);line-height:1.6 }

    .skeleton .sk-line { height:12px;background:#e5e7eb;border-radius:3px;margin-bottom:8px;animation:shimmer 1.5s infinite }
    .sk-line.w60 { width:60% } .sk-line.w80 { width:80% } .sk-line.w100 { width:100% }
    @keyframes shimmer { 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }

    .empty { text-align:center;padding:80px 20px;color:var(--muted) }
    .empty .icon { font-size:36px;margin-bottom:10px }
    .empty .msg { font-family:'Noto Serif SC',serif;font-size:16px;margin-bottom:4px }
    .empty .hint { font-size:13px;color:var(--light) }
    .retry { display:inline-block;margin-top:12px;padding:6px 20px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer }

    .disclaimer { padding:10px 0 14px;margin-bottom:14px;border-bottom:1px solid var(--border);font-family:'Noto Serif SC',serif;font-size:12px;color:var(--muted);font-style:italic }
    .footer { text-align:center;padding:20px;font-size:11px;color:var(--light);border-top:1px solid var(--border) }

    @media(max-width:600px){ .container { padding:12px 12px 32px } .header { padding:24px 12px 16px } .header h1 { font-size:22px } .card-title { font-size:16px } .stats .n { font-size:24px } }
  </style>
</head>
<body>
<div class="head-bar"></div>
<div class="header">
  <h1>HR × AI 资讯台</h1>
  <div class="sub">聚焦人力资源与人工智能交叉领域</div>
  <div class="time" id="time"></div>
</div>

<div class="container">
  <div class="disclaimer">本页面仅汇总公开资讯，不构成劳动法律意见。政策类内容请以官方原文及法务意见为准。</div>

  <div class="stats" id="stats" style="display:none">
    <div class="s"><div class="n" id="st1">-</div><div class="l">今日资讯</div></div>
    <div class="s"><div class="n" id="st2">-</div><div class="l">信息源</div></div>
    <div class="s"><div class="n" id="st3">-</div><div class="l">高相关度</div></div>
  </div>

  <div class="tabs" id="tabs"><div class="tab on" data-cat="">全部</div></div>

  <div class="mode-bar" id="modes" style="display:none">
    <button class="mode-btn on" id="btnAll">全部</button>
    <button class="mode-btn" id="btnSig">高相关度</button>
    <span class="mode-hint" title="仅显示综合评分≥0.55的资讯，筛选出最值得关注的内容">?</span>
  </div>

  <div class="list" id="list">
    <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
    <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
    <div class="skeleton"><div class="sk-line w80"></div><div class="sk-line w100"></div><div class="sk-line w60"></div></div>
  </div>
</div>

<div class="footer">HR × AI 资讯台 · 内部试运行</div>

<script>
var mode='all', cat='', store;

fetch('../data/hr-radar.json').then(function(r){return r.json()}).then(function(d){
  var t=(d.generated_at||'').substring(0,19).replace('T',' ');
  document.getElementById('time').textContent=t;
  var all=d.all_items||[],cats=d.categories||[];
  if(!all.length){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">📭</div><div class="msg">暂无资讯</div><div class="hint">上次更新：'+(t||'未知')+'</div></div>';return}
  store=d;
  document.getElementById('stats').style.display='flex';
  document.getElementById('modes').style.display='flex';
  document.getElementById('st1').textContent=all.length;
  var srcs=new Set();all.forEach(function(x){srcs.add(x.source_name)});
  document.getElementById('st2').textContent=srcs.size;
  document.getElementById('st3').textContent=all.filter(function(x){return(x.relevance||0)>=0.55}).length;
  buildTabs(cats);
  render();
}).catch(function(e){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">⚠️</div><div class="msg">数据加载失败</div><div class="hint">'+esc(e.message)+'</div><button class="retry" onclick="location.reload()">重新加载</button></div>'});

function buildTabs(cats){
  var h='<div class="tab on" data-cat="">全部</div>';
  for(var i=0;i<cats.length;i++){
    var n=((store.items_by_category||{})[cats[i]]||[]).length;
    if(!n)continue;
    h+='<div class="tab" data-cat="'+esc(cats[i])+'">'+esc(cats[i])+'<span class="c"> '+n+'</span></div>';
  }
  document.getElementById('tabs').innerHTML=h;
  document.getElementById('tabs').onclick=function(e){
    var t=e.target.closest('.tab');if(!t)return;
    cat=t.dataset.cat||'';
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});
    render();
  };
}

function catClass(c){if(!c)return'';if(c.indexOf('政策')>=0)return'policy';if(c.indexOf('招聘')>=0)return'recruit';if(c.indexOf('组织')>=0||c.indexOf('人才')>=0)return'org';if(c.indexOf('学习')>=0||c.indexOf('技能')>=0)return'learn';if(c.indexOf('产品')>=0||c.indexOf('数字化')>=0)return'product';return'case'}

function scoreLabel(s){if(s>=0.55)return'hi';if(s>=0.3)return'mid';return'lo'}
function scoreText(s){if(s>=0.55)return'高';if(s>=0.3)return'中';return''}

function render(){
  var el=document.getElementById('list'),h='',all=store.all_items||[],byCat=store.items_by_category||{};
  var items=cat?(byCat[cat]||[]):all.slice();
  if(mode==='signal')items=items.filter(function(x){return(x.relevance||0)>=0.55});
  if(!items.length){el.innerHTML='<div class="empty"><div class="msg">无匹配内容</div></div>';return}
  for(var i=0;i<items.length;i++){
    var it=items[i],t=it.title_zh||it.title,sc=it.relevance||0,sl=scoreLabel(sc),st=scoreText(sc);
    if(it.source_id==='aihot'&&t.indexOf('AI HOT')===0){var m=t.match(/— (.+)/);t=m?m[1]:t}
    h+='<div class="card">';
    h+='<div class="card-row1">';
    h+='<span class="card-cat '+catClass(it.category)+'">'+esc(it.category||'')+'</span>';
    h+='<span class="card-src">'+esc(it.source_name||'')+'</span>';
    if(st)h+='<span class="card-score '+sl+'" title="相关度 '+sc.toFixed(2)+'">'+st+'相关</span>';
    h+='<span class="card-date">'+fmt(it.published_at)+'</span>';
    h+='</div>';
    h+='<div class="card-title"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(t)+'</a></div>';
    if(it.title_zh&&it.title_zh!==it.title)h+='<div class="card-eng">'+esc(it.title)+'</div>';
    if(it.summary_zh)h+='<div class="card-desc">'+esc(it.summary_zh)+'</div>';
    h+='</div>';
  }
  el.innerHTML=h;
}

document.getElementById('btnSig').onclick=function(){mode='signal';u()};
document.getElementById('btnAll').onclick=function(){mode='all';u()};
function u(){document.getElementById('btnSig').className='mode-btn'+(mode==='signal'?' on':'');document.getElementById('btnAll').className='mode-btn'+(mode==='all'?' on':'');render()}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmt(s){if(!s)return'';try{var d=new Date(s);return d.toLocaleString('zh-CN',{month:'short',day:'numeric'})}catch(e){return''}}
</script>
</body>
</html>
